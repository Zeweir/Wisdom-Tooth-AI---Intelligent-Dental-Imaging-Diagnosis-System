services:
  postgres:
    image: postgres:16
    container_name: wisdom-tooth-ai-postgres
    environment:
      POSTGRES_DB: wisdom_tooth_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wisdom_tooth_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  logto-postgres:
    image: postgres:16
    container_name: wisdom-tooth-ai-logto-postgres
    environment:
      POSTGRES_DB: logto
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: p0stgr3s
    ports:
      - "5433:5432"
    volumes:
      - logto_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logto"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: wisdom-tooth-ai-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  redis:
    image: redis:7-alpine
    container_name: wisdom-tooth-ai-redis
    ports:
      - "6379:6379"

  logto:
    image: svhd/logto:latest
    container_name: wisdom-tooth-ai-logto
    entrypoint: ["sh", "-c", "npm run cli db seed -- --swe && npm start"]
    environment:
      TRUST_PROXY_HEADER: 1
      DB_URL: postgres://postgres:p0stgr3s@logto-postgres:5432/logto
      ENDPOINT: http://127.0.0.1:3001
      ADMIN_ENDPOINT: http://127.0.0.1:3002
    ports:
      - "3001:3001"
      - "3002:3002"
    depends_on:
      logto-postgres:
        condition: service_healthy

  backend:
    image: wisdom-tooth-ai-backend:local
    build:
      context: ./backend
    container_name: wisdom-tooth-ai-backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/wisdom_tooth_ai
      STORAGE_PROVIDER: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: wisdom-tooth-images
      MINIO_SECURE: false
      LOGTO_ENDPOINT: http://127.0.0.1:3001
      LOGTO_ISSUER: http://127.0.0.1:3001/oidc
      LOGTO_JWKS_URI: http://logto:3001/oidc/jwks
      LOGTO_API_RESOURCE: https://api.wisdom-tooth-ai.local
      LOGTO_ROLE_CLAIM_NAMES: urn:logto:roles,roles
      LOGTO_REQUIRE_ROLE_CLAIM: false
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      OLLAMA_ENABLED: true
      OLLAMA_BASE_URL: http://10.41.33.17:11434
      OLLAMA_MODEL: qwen3.5:9b
      OLLAMA_TIMEOUT_SECONDS: 120
      YOLO_ENABLED: true
      YOLO_MODEL_PATH: /models/dental-yolo.pt
      YOLO_CONF_THRESHOLD: 0.25
      YOLO_IMAGE_SIZE: 1024
      YOLO_DEVICE: ""
      YOLO_CLASS_MAP_JSON: ""
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models:ro
      - ./datasets:/datasets:ro
    depends_on:
      postgres:
        condition: service_healthy
      logto:
        condition: service_started
      minio:
        condition: service_started
      redis:
        condition: service_started

  celery-worker:
    image: wisdom-tooth-ai-backend:local
    container_name: wisdom-tooth-ai-celery-worker
    command:
      ["celery", "-A", "app.celery_app.celery_app", "worker", "--loglevel=info"]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/wisdom_tooth_ai
      STORAGE_PROVIDER: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: wisdom-tooth-images
      MINIO_SECURE: false
      LOGTO_ENDPOINT: http://127.0.0.1:3001
      LOGTO_ISSUER: http://127.0.0.1:3001/oidc
      LOGTO_JWKS_URI: http://logto:3001/oidc/jwks
      LOGTO_API_RESOURCE: https://api.wisdom-tooth-ai.local
      LOGTO_ROLE_CLAIM_NAMES: urn:logto:roles,roles
      LOGTO_REQUIRE_ROLE_CLAIM: false
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      OLLAMA_ENABLED: true
      OLLAMA_BASE_URL: http://10.41.33.17:11434
      OLLAMA_MODEL: qwen3.5:9b
      OLLAMA_TIMEOUT_SECONDS: 120
      YOLO_ENABLED: true
      YOLO_MODEL_PATH: /models/dental-yolo.pt
      YOLO_CONF_THRESHOLD: 0.25
      YOLO_IMAGE_SIZE: 1024
      YOLO_DEVICE: ""
      YOLO_CLASS_MAP_JSON: ""
    volumes:
      - ./models:/models:ro
      - ./datasets:/datasets:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    container_name: wisdom-tooth-ai-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
      - logto

volumes:
  postgres_data:
  logto_postgres_data:
  minio_data:
