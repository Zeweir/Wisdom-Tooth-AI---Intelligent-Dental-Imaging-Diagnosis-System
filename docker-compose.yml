services:
  postgres:
    image: postgres:16
    container_name: wisdom-tooth-ai-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wisdom_tooth_ai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-wisdom_tooth_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  logto-postgres:
    image: postgres:16
    container_name: wisdom-tooth-ai-logto-postgres
    environment:
      POSTGRES_DB: ${LOGTO_POSTGRES_DB:-logto}
      POSTGRES_USER: ${LOGTO_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${LOGTO_POSTGRES_PASSWORD:-p0stgr3s}
    ports:
      - "${LOGTO_POSTGRES_BIND_HOST:-127.0.0.1}:${LOGTO_POSTGRES_PORT:-5433}:5432"
    volumes:
      - logto_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOGTO_POSTGRES_USER:-postgres} -d ${LOGTO_POSTGRES_DB:-logto}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: wisdom-tooth-ai-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_BIND_HOST:-127.0.0.1}:${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_BIND_HOST:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  redis:
    image: redis:7-alpine
    container_name: wisdom-tooth-ai-redis
    ports:
      - "${REDIS_BIND_HOST:-127.0.0.1}:${REDIS_PORT:-6379}:6379"

  logto:
    image: svhd/logto:latest
    container_name: wisdom-tooth-ai-logto
    entrypoint: ["sh", "-c", "npm run cli db seed -- --swe && npm start"]
    environment:
      TRUST_PROXY_HEADER: ${LOGTO_TRUST_PROXY_HEADER:-1}
      DB_URL: postgres://${LOGTO_POSTGRES_USER:-postgres}:${LOGTO_POSTGRES_PASSWORD:-p0stgr3s}@logto-postgres:5432/${LOGTO_POSTGRES_DB:-logto}
      ENDPOINT: ${PUBLIC_SCHEME:-https}://${PUBLIC_HOST:-127.0.0.1}${PUBLIC_LOGTO_PORT_SUFFIX:-:3001}
      ADMIN_ENDPOINT: ${PUBLIC_SCHEME:-https}://${PUBLIC_HOST:-127.0.0.1}${PUBLIC_LOGTO_ADMIN_PORT_SUFFIX:-:3002}
    expose:
      - "3001"
      - "3002"
    depends_on:
      logto-postgres:
        condition: service_healthy

  backend:
    image: wisdom-tooth-ai-backend:local
    pull_policy: never
    build:
      context: ./backend
      args:
        APT_MIRROR: ${APT_MIRROR:-http://deb.debian.org/debian}
        APT_SECURITY_MIRROR: ${APT_SECURITY_MIRROR:-http://security.debian.org/debian-security}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    container_name: wisdom-tooth-ai-backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-wisdom_tooth_ai}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-wisdom-tooth-images}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      LOGTO_ENDPOINT: ${PUBLIC_SCHEME:-https}://${PUBLIC_HOST:-127.0.0.1}${PUBLIC_LOGTO_PORT_SUFFIX:-:3001}
      LOGTO_ISSUER: ${PUBLIC_SCHEME:-https}://${PUBLIC_HOST:-127.0.0.1}${PUBLIC_LOGTO_PORT_SUFFIX:-:3001}/oidc
      LOGTO_JWKS_URI: http://logto:3001/oidc/jwks
      LOGTO_API_RESOURCE: ${LOGTO_API_RESOURCE:-https://api.wisdom-tooth-ai.local}
      LOGTO_ROLE_CLAIM_NAMES: ${LOGTO_ROLE_CLAIM_NAMES:-urn:logto:roles,roles}
      LOGTO_REQUIRE_ROLE_CLAIM: ${LOGTO_REQUIRE_ROLE_CLAIM:-false}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:9b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
      YOLO_ENABLED: ${YOLO_ENABLED:-false}
      YOLO_MODEL_PATH: ${YOLO_MODEL_PATH:-/models/dental-yolo.pt}
      YOLO_CONF_THRESHOLD: ${YOLO_CONF_THRESHOLD:-0.25}
      YOLO_IMAGE_SIZE: ${YOLO_IMAGE_SIZE:-1024}
      YOLO_DEVICE: ${YOLO_DEVICE:-}
      YOLO_CLASS_MAP_JSON: ${YOLO_CLASS_MAP_JSON:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://127.0.0.1,https://localhost,http://127.0.0.1,http://localhost,http://127.0.0.1:5173,http://localhost:5173}
    ports:
      - "${BACKEND_BIND_HOST:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./models:/models:ro
      - ./datasets:/datasets:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      logto:
        condition: service_started
      minio:
        condition: service_started
      redis:
        condition: service_started

  celery-worker:
    image: wisdom-tooth-ai-backend:local
    pull_policy: never
    container_name: wisdom-tooth-ai-celery-worker
    command:
      ["celery", "-A", "app.celery_app.celery_app", "worker", "--loglevel=info"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-wisdom_tooth_ai}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-wisdom-tooth-images}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      LOGTO_ENDPOINT: ${PUBLIC_SCHEME:-https}://${PUBLIC_HOST:-127.0.0.1}${PUBLIC_LOGTO_PORT_SUFFIX:-:3001}
      LOGTO_ISSUER: ${PUBLIC_SCHEME:-https}://${PUBLIC_HOST:-127.0.0.1}${PUBLIC_LOGTO_PORT_SUFFIX:-:3001}/oidc
      LOGTO_JWKS_URI: http://logto:3001/oidc/jwks
      LOGTO_API_RESOURCE: ${LOGTO_API_RESOURCE:-https://api.wisdom-tooth-ai.local}
      LOGTO_ROLE_CLAIM_NAMES: ${LOGTO_ROLE_CLAIM_NAMES:-urn:logto:roles,roles}
      LOGTO_REQUIRE_ROLE_CLAIM: ${LOGTO_REQUIRE_ROLE_CLAIM:-false}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:9b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
      YOLO_ENABLED: ${YOLO_ENABLED:-false}
      YOLO_MODEL_PATH: ${YOLO_MODEL_PATH:-/models/dental-yolo.pt}
      YOLO_CONF_THRESHOLD: ${YOLO_CONF_THRESHOLD:-0.25}
      YOLO_IMAGE_SIZE: ${YOLO_IMAGE_SIZE:-1024}
      YOLO_DEVICE: ${YOLO_DEVICE:-}
      YOLO_CLASS_MAP_JSON: ${YOLO_CLASS_MAP_JSON:-}
    volumes:
      - ./models:/models:ro
      - ./datasets:/datasets:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_LOGTO_ENDPOINT: ${PUBLIC_SCHEME:-https}://${PUBLIC_HOST:-127.0.0.1}${PUBLIC_LOGTO_PORT_SUFFIX:-:3001}
        VITE_LOGTO_APP_ID: ${VITE_LOGTO_APP_ID:-}
        VITE_LOGTO_API_RESOURCE: ${LOGTO_API_RESOURCE:-https://api.wisdom-tooth-ai.local}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    container_name: wisdom-tooth-ai-frontend
    ports:
      - "${FRONTEND_BIND_HOST:-127.0.0.1}:${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
      - logto

  gateway:
    image: nginx:1.27-alpine
    container_name: wisdom-tooth-ai-gateway
    ports:
      - "${GATEWAY_HTTP_BIND_HOST:-0.0.0.0}:${GATEWAY_HTTP_PORT:-80}:80"
      - "${GATEWAY_HTTPS_BIND_HOST:-0.0.0.0}:${GATEWAY_HTTPS_PORT:-443}:443"
      - "${GATEWAY_LOGTO_BIND_HOST:-0.0.0.0}:${GATEWAY_LOGTO_PORT:-3001}:3001"
      - "${GATEWAY_LOGTO_ADMIN_BIND_HOST:-0.0.0.0}:${GATEWAY_LOGTO_ADMIN_PORT:-3002}:3002"
    volumes:
      - ./deploy/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
      - logto

volumes:
  postgres_data:
  logto_postgres_data:
  minio_data:
