# 生产环境 — 直接从 GitHub Container Registry 拉取镜像部署
# 使用方式:
#   echo "$GITHUB_TOKEN" | docker login ghcr.io -u <用户名> --password-stdin
#   docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:16
    container_name: wisdom-tooth-ai-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wisdom_tooth_ai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-wisdom_tooth_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: wisdom-tooth-ai-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: wisdom-tooth-ai-redis
    restart: unless-stopped

  backend:
    image: ghcr.io/${GITHUB_USER:-user}/wisdom-tooth-backend:latest
    pull_policy: always
    container_name: wisdom-tooth-ai-backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-wisdom_tooth_ai}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-wisdom-tooth-images}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:9b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
      YOLO_ENABLED: ${YOLO_ENABLED:-false}
      YOLO_MODEL_PATH: ${YOLO_MODEL_PATH:-/models/dental-yolo.pt}
      YOLO_CONF_THRESHOLD: ${YOLO_CONF_THRESHOLD:-0.25}
      YOLO_IMAGE_SIZE: ${YOLO_IMAGE_SIZE:-1024}
      YOLO_DEVICE: ${YOLO_DEVICE:-}
      YOLO_CLASS_MAP_JSON: ${YOLO_CLASS_MAP_JSON:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
    volumes:
      - ./models:/models:ro
      - ./datasets:/datasets:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped

  celery-worker:
    image: ghcr.io/${GITHUB_USER:-user}/wisdom-tooth-backend:latest
    pull_policy: always
    container_name: wisdom-tooth-ai-celery-worker
    command: ["celery", "-A", "app.celery_app.celery_app", "worker", "--loglevel=info"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-wisdom_tooth_ai}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-wisdom-tooth-images}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:9b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
      YOLO_ENABLED: ${YOLO_ENABLED:-false}
      YOLO_MODEL_PATH: ${YOLO_MODEL_PATH:-/models/dental-yolo.pt}
      YOLO_CONF_THRESHOLD: ${YOLO_CONF_THRESHOLD:-0.25}
      YOLO_IMAGE_SIZE: ${YOLO_IMAGE_SIZE:-1024}
      YOLO_DEVICE: ${YOLO_DEVICE:-}
      YOLO_CLASS_MAP_JSON: ${YOLO_CLASS_MAP_JSON:-}
    volumes:
      - ./models:/models:ro
      - ./datasets:/datasets:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    image: ghcr.io/${GITHUB_USER:-user}/wisdom-tooth-frontend:latest
    pull_policy: always
    container_name: wisdom-tooth-ai-frontend
    depends_on:
      - backend
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    container_name: wisdom-tooth-ai-gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
