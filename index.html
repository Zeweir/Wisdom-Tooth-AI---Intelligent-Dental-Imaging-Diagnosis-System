            border-radius: 4px;

            position: absolute;

            left: 50%;
            transform: translateX(-50%);

        .nav-item i {
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);

        .nav-item.active i {

                    <img src="https://placehold.co/100x100/3B82F6/FFFFFF?text=XM" class="w-10 h-10 rounded-full shrink-0">
                </div>
             `;
             container.innerHTML += userMsg;
             container.scrollTop = container.scrollHeight;

             // 模拟 AI 回复
             setTimeout(() => {
                 const aiMsg = `
                    <div class="flex gap-3 animate-fade-in">
                        <div class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center text-white shrink-0 shadow-md">
                            <i class="fas fa-tooth text-sm"></i>
                        </div>
                        <div class="bg-white p-4 rounded-2xl rounded-tl-none shadow-sm max-w-[80%]">
                            <p class="text-sm text-gray-700 leading-relaxed">正在为您分析关于“${text}”的问题...</p>
                        </div>
                    </div>
                 `;
                 container.innerHTML += aiMsg;
                 container.scrollTop = container.scrollHeight;
             }, 800);
        }

        // 初始页面渲染
        window.onload = () => {
            switchPage('splash');
        };
    </script>

    <style>
        /* 动画定义 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        /* 隐藏滚动条但保留功能 */
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        /* snaps */
        .snap-x {
            scroll-snap-type: x mandatory;
        }
        .snap-center {
            scroll-snap-align: center;
        }
        
        .pl-13 { padding-left: 3.25rem; }
    </style>
</body>
</html>
